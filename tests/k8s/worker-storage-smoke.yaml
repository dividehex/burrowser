apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bw-smoke-pvc
  labels:
    app.kubernetes.io/name: burrowser-worker
    burrowser/test: storage-smoke
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: burrowser-local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: bw-smoke-worker
  labels:
    app.kubernetes.io/name: burrowser-worker
    burrowser/test: storage-smoke
spec:
  automountServiceAccountToken: false
  serviceAccountName: burrowser-worker
  containers:
  - name: worker
    image: burrowser-worker:dev
    imagePullPolicy: Never
    command: [node, -e]
    args: ["require('fs').mkdirSync('/profile/chromium',{recursive:true}); require('fs').writeFileSync('/profile/chromium/smoke.txt','ok'); setTimeout(()=>{}, 3600000)"]
    securityContext:
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
    volumeMounts:
    - name: profile
      mountPath: /profile
  volumes:
  - name: profile
    persistentVolumeClaim:
      claimName: bw-smoke-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: bw-smoke-worker
  labels:
    burrowser/test: storage-smoke
spec:
  type: ClusterIP
  selector:
    burrowser/test: storage-smoke
  ports:
  - name: rpc
    port: 8080
    targetPort: 8080
