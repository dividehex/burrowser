apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ab-runtime-pvc
  namespace: agent-browser
  labels:
    app.kubernetes.io/name: agent-browser-worker
    agent-browser/test: runtime-smoke
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: agent-browser-local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: ab-runtime-worker-auth
  namespace: agent-browser
  labels:
    agent-browser/test: runtime-smoke
type: Opaque
stringData:
  WORKER_CONTROLLER_CREDENTIAL: disposable-runtime-secret
  AGENT_BROWSER_AUTHENTICATOR_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
---
apiVersion: v1
kind: Pod
metadata:
  name: ab-runtime-worker
  namespace: agent-browser
  labels:
    app.kubernetes.io/name: agent-browser-worker
    agent-browser/test: runtime-smoke
spec:
  automountServiceAccountToken: false
  serviceAccountName: agent-browser-worker
  securityContext:
    seccompProfile:
      type: Localhost
      localhostProfile: agent-browser/chromium.json
  containers:
  - name: worker
    image: agent-browser-worker:dev
    imagePullPolicy: Never
    envFrom:
    - secretRef:
        name: ab-runtime-worker-auth
    env:
    - name: DEBUG
      value: pw:browser*
    ports:
    - name: rpc
      containerPort: 8080
    securityContext:
      runAsNonRoot: true
      runAsUser: 10001
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
    resources:
      requests: {cpu: 250m, memory: 512Mi}
      limits: {cpu: 1, memory: 1Gi, ephemeral-storage: 1Gi}
    readinessProbe:
      httpGet: {path: /health, port: rpc}
      initialDelaySeconds: 2
      periodSeconds: 2
    volumeMounts:
    - {name: profile, mountPath: /profile}
    - {name: tmp, mountPath: /tmp}
    - {name: shm, mountPath: /dev/shm}
    - {name: home, mountPath: /home/browser}
  volumes:
  - name: profile
    persistentVolumeClaim: {claimName: ab-runtime-pvc}
  - name: tmp
    emptyDir: {sizeLimit: 256Mi}
  - name: shm
    emptyDir: {medium: Memory, sizeLimit: 256Mi}
  - name: home
    emptyDir: {sizeLimit: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: ab-runtime-worker
  namespace: agent-browser
  labels:
    agent-browser/test: runtime-smoke
spec:
  type: ClusterIP
  selector:
    agent-browser/test: runtime-smoke
  ports:
  - {name: rpc, port: 8080, targetPort: rpc}
