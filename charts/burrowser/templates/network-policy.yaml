apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: burrowser-worker-default-deny
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: burrowser-worker
  policyTypes: [Ingress, Egress]
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: burrowser-controller
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 5900
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # The browser gets the public internet and nothing else: private, carrier-
  # grade NAT and link-local ranges are carved out, so a page cannot drive it
  # at the LAN, the node, other pods, the Kubernetes API or a metadata endpoint.
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        {{- toYaml .Values.worker.egressExcept | nindent 8 }}
    ports:
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 443
