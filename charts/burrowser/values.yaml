# No official images are published for this project. Build both images from
# source (see the root Dockerfile and worker/Dockerfile) and push them to a
# registry your cluster can pull from — your own private registry, or one
# you run inside the cluster itself (k3s: https://k3d.io or a plain
# `registry:2` Deployment). scripts/build-and-deploy-local.sh automates this
# end to end for a single-node k3s + local registry setup.
image:
  repository: registry.local/burrowser-controller
  digest: ''
  pullPolicy: IfNotPresent
namespace: burrowser
workerImage:
  repository: registry.local/burrowser-worker
  digest: ''
  pullPolicy: IfNotPresent
storageClass: burrowser-local-path
controllerSecretName: burrowser-controller-secrets
postgres:
  enabled: false
  secretName: burrowser-postgres
service:
  type: ClusterIP
  port: 8080
# Playwright MCP is what agents get, unmodified. These two settings only choose which of its tools exist.
mcp:
  # Playwright MCP tool groups the worker enables (comma separated; "core" is a stock server). Others it
  # documents: vision, pdf, devtools, network, storage, testing, config.
  capabilities: core
  # Individual tool names to switch off at the gateway, e.g. "browser_evaluate,browser_file_upload".
  excludeTools: ''
