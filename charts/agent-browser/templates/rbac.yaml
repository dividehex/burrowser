apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-browser-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-browser-controller
rules:
- apiGroups: ['']
  resources: [pods, services, persistentvolumeclaims]
  verbs: [get, list, watch, create, delete, patch, update]
- apiGroups: ['']
  resources: [secrets]
  verbs: [get, create, delete, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-browser-controller
subjects:
- kind: ServiceAccount
  name: agent-browser-controller
roleRef:
  kind: Role
  name: agent-browser-controller
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-browser-worker
automountServiceAccountToken: false
