apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-browser-worker-default-deny
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agent-browser-worker
  policyTypes: [Ingress, Egress]
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: agent-browser-controller
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 5900
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - ports:
    - protocol: TCP
      port: 443
